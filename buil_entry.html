<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>부일초 엔트리 계정 복사</title>
  <style>
    :root { --navy:#173b63; --blue:#2476d2; --sky:#eaf4ff; --green:#16835b; --purple:#7357c7; --ink:#17212b; --muted:#607080; --line:#d7e1ea; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; color:var(--ink); background:linear-gradient(145deg,#e9f5ff 0%,#f8fbff 45%,#edf9f3 100%); }
    main { width:min(680px,calc(100% - 28px)); margin:0 auto; padding:42px 0 56px; }
    .card { background:#fff; border:1px solid rgba(23,59,99,.12); border-radius:24px; padding:clamp(22px,5vw,38px); box-shadow:0 18px 55px rgba(31,65,95,.14); }
    h1 { margin:0; color:var(--navy); font-size:clamp(27px,6vw,40px); letter-spacing:-1.5px; text-align:center; }
    .subtitle { margin:10px 0 30px; color:var(--muted); text-align:center; font-size:16px; }
    label { display:block; margin:0 0 9px; font-weight:700; font-size:17px; }
    select { width:100%; height:58px; border:2px solid var(--line); border-radius:14px; padding:0 16px; font:700 20px/1 "Malgun Gothic",sans-serif; color:var(--ink); background:#fff; outline:none; }
    select:focus { border-color:var(--blue); box-shadow:0 0 0 4px rgba(36,118,210,.12); }
    .selectors { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
    .account { margin-top:22px; padding:20px; border-radius:18px; background:var(--sky); }
    .student { margin-bottom:16px; color:var(--navy); font-size:24px; font-weight:800; text-align:center; }
    .buttons { display:grid; gap:12px; }
    button { width:100%; min-height:62px; border:0; border-radius:15px; padding:13px 18px; color:#fff; font:800 19px/1.25 "Malgun Gothic",sans-serif; cursor:pointer; box-shadow:0 7px 15px rgba(29,59,89,.15); transition:transform .08s ease,filter .15s ease; }
    button:hover { filter:brightness(1.06); }
    button:active { transform:translateY(2px); }
    .id { background:var(--blue); }
    .temp { background:var(--green); }
    .password { background:var(--purple); }
    .help { margin:8px 2px 0; color:var(--muted); font-size:13px; line-height:1.55; }
    .notice { min-height:26px; margin:20px 0 0; color:var(--navy); font-weight:800; text-align:center; }
    .privacy { margin:18px 0 0; color:#73808c; font-size:12px; line-height:1.55; text-align:center; }
    @media (max-width:480px) { main{padding-top:18px}.card{border-radius:18px}.selectors{grid-template-columns:1fr} button{font-size:18px} }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="title">
      <h1 id="title">엔트리 계정 복사</h1>
      <p class="subtitle">학년, 반, 번호를 차례로 선택하세요.</p>

      <div class="selectors">
        <div><label for="grade">학년</label><select id="grade" aria-label="학년 선택"></select></div>
        <div><label for="classNumber">반</label><select id="classNumber" aria-label="반 선택"></select></div>
        <div><label for="studentNumber">번호</label><select id="studentNumber" aria-label="번호 선택"></select></div>
      </div>

      <div class="account">
        <div class="student" id="studentLabel">3학년 1반 1번</div>
        <div class="buttons">
          <button class="id" id="copyId" type="button">아이디 복사</button>
          <button class="temp" id="copyTemp" type="button">임시 비밀번호 복사</button>
          <button class="password" id="copyPassword" type="button">비밀번호 복사</button>
        </div>
      </div>

      <p class="notice" id="notice" role="status" aria-live="polite"></p>
      <p class="privacy">계정 정보가 들어 있는 파일입니다. 선생님이 안내한 기기에서만 사용하세요.</p>
    </section>
  </main>

    const gradeSelect = document.querySelector('#grade');
    const classSelect = document.querySelector('#classNumber');
    const numberSelect = document.querySelector('#studentNumber');
    const studentLabel = document.querySelector('#studentLabel');
    const notice = document.querySelector('#notice');
    const commonPassword = 'p369369';
    let noticeTimer;

    function setOptions(select, values, suffix) {
      select.replaceChildren();
      values.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value + suffix;
        select.appendChild(option);
      });
    }
    function availableClasses() {
      const grade = gradeSelect.value;
      return Object.keys(accountGroups).filter((key) => key.startsWith(grade + '-')).map((key) => key.split('-')[1]);
    }
    function currentGroup() { return accountGroups[gradeSelect.value + '-' + classSelect.value] || []; }
    function currentAccount() { return currentGroup().find((item) => item[0] === numberSelect.value); }
    function showNotice(message, isError = false) {
      clearTimeout(noticeTimer);
      notice.textContent = message;
      notice.style.color = isError ? '#b42318' : '#173b63';
      noticeTimer = setTimeout(() => { notice.textContent = ''; }, 2400);
    }
    function refreshLabel() {
      studentLabel.textContent = gradeSelect.value + '학년 ' + classSelect.value + '반 ' + numberSelect.value + '번';
      notice.textContent = '';
    }
    function refreshNumbers() {
      setOptions(numberSelect, currentGroup().map((item) => item[0]), '번');
      refreshLabel();
    }
    function refreshClasses() {
      setOptions(classSelect, availableClasses(), '반');
      refreshNumbers();
    }
    async function copyText(value, labelText) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(value);
        } else {
          const box = document.createElement('textarea');
          box.value = value;
          box.style.position = 'fixed'; box.style.opacity = '0';
          document.body.appendChild(box); box.select();
          if (!document.execCommand('copy')) throw new Error('copy failed');
          box.remove();
        }
        showNotice(labelText + '가 복사되었습니다.');
      } catch (_) { showNotice('복사하지 못했습니다. 브라우저의 클립보드 권한을 확인해 주세요.', true); }
    }

    setOptions(gradeSelect, ['3','4','5','6'], '학년');
    gradeSelect.addEventListener('change', refreshClasses);
    classSelect.addEventListener('change', refreshNumbers);
    numberSelect.addEventListener('change', refreshLabel);
    document.querySelector('#copyId').addEventListener('click', () => copyText(currentAccount()[1], '아이디'));
    document.querySelector('#copyTemp').addEventListener('click', () => copyText(currentAccount()[2], '임시 비밀번호'));
    document.querySelector('#copyPassword').addEventListener('click', () => copyText(commonPassword, '비밀번호'));
    refreshClasses();
  </script>
</body>
</html>
